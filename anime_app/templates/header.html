<header>
    <div class="logo">KOTOME</div>
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Главная</a></li>
            <li><a href="{% url 'categories' %}">Категории</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'favorites' %}" class="favorites-link">
                    Избранное
                    <span class="favorites-count-badge" id="headerFavoritesCount">0</span>
                </a></li>
                <li><a href="{% url 'profile' %}">{{ user.username }}</a></li>
            {% endif %}
        </ul>
    </nav>
    <div class="header-search">
        <input type="text" class="search-input" placeholder="Поиск аниме...">
    </div>
    {% if user.is_authenticated %}
        <a href="{% url 'logout' %}" class="login-btn">Выйти</a>
    {% else %}
        <a href="{% url 'login' %}" class="login-btn">Войти</a>
    {% endif %}
</header>

<style>
.favorites-link {
    position: relative;
    display: inline-block;
}

.favorites-count-badge {
    position: absolute;
    top: -8px;
    right: -12px;
    background: #ff4757;
    color: white;
    font-size: 11px;
    font-weight: bold;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    box-shadow: 0 2px 5px rgba(255, 71, 87, 0.3);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* Светлая тема */
body.light-theme .favorites-count-badge {
    box-shadow: 0 2px 5px rgba(255, 71, 87, 0.5);
}
</style>
